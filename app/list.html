<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Daftar PN</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b82f6'/%3E%3Ctext x='50%25' y='54%25' font-family='sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EPN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css?v=20261029_7">
</head>
<body data-page="list"><header id="nav"></header>
<main>
  <div class="print-banner">
    <h2>Daftar Part Number &bull; Compare PN</h2>
    <p>Dicetak pada: <script>document.write(new Date().toLocaleString('id-ID'))</script></p>
  </div>
  <div class="search-center-wrap">
    <div class="search-center-box">
      <svg class="search-center-ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input class="f search-center-input" id="q" autocomplete="off" placeholder="Filter PN atau nama barang (tekan / untuk fokus)...">
      <button class="qc" id="qc" hidden aria-label="Hapus filter">×</button>
    </div>
    <div class="search-stats-sub mu" id="stats"></div>
  </div>

  <div class="bar control-bar">
    <div class="filter-group">
      <span class="badge" id="pendBadge" style="display:none"></span>
      <div class="menu-wrap" id="filterMenuWrap">
        <button class="btn sm menu-trigger" id="bFilterMenu" type="button" aria-expanded="false" aria-haspopup="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
          <span>Filter</span>
          <span class="filter-badge-dot" id="filterDot" hidden></span>
          <span class="menu-arrow">▾</span>
        </button>
        <div class="menu-dropdown filter-dropdown" id="filterDropdown" hidden>
          <div class="filter-dropdown-header">
            <b>Filter Data</b>
            <button type="button" class="filter-reset-btn" id="btnResetFilters">Reset</button>
          </div>
          <div class="filter-field">
            <label for="apf">Status Approval</label>
            <select id="apf" class="sm">
              <option value="">Semua status</option>
              <option value="0">Belum di-approve</option>
              <option value="1">Sudah di-approve</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="cf">Kelengkapan PN</label>
            <select id="cf" class="sm" title="Filter Kelengkapan Part Number">
              <option value="">Semua kelengkapan</option>
              <option value="single">Hanya 1 company (Belum lengkap)</option>
              <option value="multi">Lengkap (&ge; 2 company)</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="uf">Pembuat / Pengupdate</label>
            <select id="uf" class="sm">
              <option value="">Semua pembuat</option>
              <option value="me">Hanya data saya</option>
            </select>
          </div>
        </div>
      </div>
      <div class="active-filter-chips" id="filterChips"></div>
      <select id="srt" class="sm compact-select" title="Urutan Data">
        <option value="name_asc" selected>Sort: Nama (A - Z)</option>
        <option value="name_desc">Sort: Nama (Z - A)</option>
        <option value="id_desc">Sort: Terbaru</option>
        <option value="id_asc">Sort: Terlama</option>
      </select>
      <select id="sz" class="sm compact-select" title="Jumlah data per halaman">
        <option value="25">25 / hal</option>
        <option value="50" selected>50 / hal</option>
        <option value="100">100 / hal</option>
      </select>
    </div>

    <div class="action-group">
      <div class="menu-wrap" id="actMenuWrap">
        <button class="btn sm menu-trigger" id="bActMenu" type="button" aria-expanded="false" aria-haspopup="true">
          <span>Aksi</span>
          <span class="menu-arrow">▾</span>
        </button>
        <div class="menu-dropdown" id="actDropdown" hidden>
          <button class="menu-item" id="cpyAll" type="button">
            <span class="menu-item-label">Salin Semua PN</span>
            <span class="menu-item-desc">Salin nomor part halaman ini</span>
          </button>
          <button class="menu-item" id="expList" type="button">
            <span class="menu-item-label">Export CSV</span>
            <span class="menu-item-desc">Unduh seluruh data sesuai filter</span>
          </button>
          <button class="menu-item" id="bPrint" onclick="window.print()" type="button">
            <span class="menu-item-label">Cetak</span>
            <span class="menu-item-desc">Format cetak printer / PDF</span>
          </button>
          <div class="menu-sep"></div>
          <button class="menu-item" id="dn" type="button">
            <span class="menu-item-label">Rapat</span>
            <span class="menu-item-desc">Ubah kerapatan baris tabel</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="tw grow" id="tw"><table class="data"><thead id="head"></thead><tbody id="body"></tbody></table></div>
  <div id="empty"></div>
  <div class="pager" id="pager">
    <span class="mu" id="info"></span><span class="sp"></span>
    <button class="btn" id="pv">&lsaquo; Sebelumnya</button>
    Hal <input type="number" id="pg" min="1" value="1"> / <span id="tp">1</span>
    <button class="btn" id="nx">Berikutnya &rsaquo;</button>
  </div>
  <button class="btn top-btn" id="topBtn" aria-label="Ke atas">↑ Ke atas</button>
</main>
<script src="/static/neko.js"></script>
<script src="/static/app.js?v=20261029_7"></script><script src="/static/toast.js"></script>
<script>
let page=1,pages=1,t;
const P=new URLSearchParams(location.search);
function clearFilter(){
  $('#q').value='';
  $('#qc').hidden=true;
  go(1);
  $('#q').focus();
}
async function go(p){
  page=Math.max(1,p||1);
  const size=$('#sz').value,q=$('#q').value.trim(),ap=$('#apf').value,cf=$('#cf')?.value||'',uf=$('#uf')?.value||'',srt=$('#srt')?.value||'name_asc';
  CURRENT_SORT = srt;
  try{localStorage.setItem('cmp_list_sz',size);localStorage.setItem('cmp_list_ap',ap);localStorage.setItem('cmp_list_cf',cf);localStorage.setItem('cmp_list_uf',uf);localStorage.setItem('cmp_list_srt',srt);}catch(e){}

  // Skeleton shimmer placeholder
  $('#head').innerHTML=typeof headHtml==='function'?headHtml():'';
  $('#body').innerHTML=skeletonHtml((COMPS.length||4)+1, Math.min(parseInt(size,10)||10, 8));
  $('#tw').hidden=false;
  $('#empty').innerHTML='';

  const r=await jget(`/api/list?page=${page}&size=${size}&q=${encodeURIComponent(q)}&approved=${encodeURIComponent(ap)}&completeness=${encodeURIComponent(cf)}&user_filter=${encodeURIComponent(uf)}&sort=${encodeURIComponent(srt)}`);
  pages=Math.max(1,Math.ceil(r.total/r.size));
  if(page>pages)return go(pages);
  history.replaceState(null,'',`?page=${page}&size=${size}`+(q?'&q='+encodeURIComponent(q):'')+(ap?'&approved='+encodeURIComponent(ap):'')+(cf?'&completeness='+encodeURIComponent(cf):'')+(uf?'&user_filter='+encodeURIComponent(uf):'')+(srt&&srt!=='name_asc'?'&sort='+encodeURIComponent(srt):''));
  updateFilterChips();

  const pb=$('#pendBadge');
  if(pb){
    if(r.pending){
      pb.style.display='inline-flex';
      pb.textContent=`Belum di-approve: ${fmt(r.pending)}`;
      pb.title = ap === '0' ? 'Klik untuk tampilkan semua status' : 'Klik untuk filter hanya yang belum di-approve';
      pb.onclick = () => {
        $('#apf').value = $('#apf').value === '0' ? '' : '0';
        go(1);
      };
    } else {
      pb.style.display='none';
    }
  }

  const hasItems=r.total>0;
  $('#tw').hidden=!hasItems;
  $('#pager').hidden=!hasItems;

  if(!hasItems){
    $('#empty').innerHTML=q
      ?`<div class="empty">Tidak ada barang yang cocok dengan filter <code>${esc(q)}</code>.<br><button class="btn sm" id="resetQ" style="margin-top:12px">Reset Filter</button></div>`
      :`<div class="empty">Belum ada data barang.<br>Tambahkan lewat menu <b>+ Tambah</b> atau <b>Import</b>.</div>`;
    const b=$('#resetQ');
    if(b)b.onclick=clearFilter;
    return;
  }

  $('#empty').innerHTML='';
  $('#pg').value=page;$('#tp').textContent=fmt(pages);
  $('#pv').disabled=page<=1;$('#nx').disabled=page>=pages;
  const from=r.total?(page-1)*r.size+1:0,to=Math.min(page*r.size,r.total);
  $('#info').textContent=`${fmt(from)}-${fmt(to)} dari ${fmt(r.total)} barang`;
  $('#head').innerHTML=typeof headHtml==='function'?headHtml():'';
  $('#body').innerHTML=r.items.map((i,n)=>'<tr>'+rowCells(i,q,from+n)+'</tr>').join('');
  $('.tw').scrollTop=0;
}
function updateFilterChips(){
  const chipsEl = $('#filterChips');
  const dotEl = $('#filterDot');
  if(!chipsEl) return;
  chipsEl.innerHTML = '';
  let activeCount = 0;

  const ap = $('#apf')?.value || '';
  if(ap === '0'){
    activeCount++;
    chipsEl.appendChild(createChip('Belum approve', () => { $('#apf').value = ''; go(1); }));
  } else if(ap === '1'){
    activeCount++;
    chipsEl.appendChild(createChip('Sudah approve', () => { $('#apf').value = ''; go(1); }));
  }

  const cf = $('#cf')?.value || '';
  if(cf === 'single'){
    activeCount++;
    chipsEl.appendChild(createChip('1 Company', () => { $('#cf').value = ''; go(1); }));
  } else if(cf === 'multi'){
    activeCount++;
    chipsEl.appendChild(createChip('Lengkap', () => { $('#cf').value = ''; go(1); }));
  } else if(cf.startsWith('only:')){
    activeCount++;
    const coName = cf.split(':', 2)[1];
    chipsEl.appendChild(createChip(`Hanya ${coName}`, () => { $('#cf').value = ''; go(1); }));
  }

  const uf = $('#uf')?.value || '';
  if(uf === 'me'){
    activeCount++;
    chipsEl.appendChild(createChip('Data saya', () => { $('#uf').value = ''; go(1); }));
  } else if(uf){
    activeCount++;
    const opt = $('#uf')?.querySelector(`option[value="${uf}"]`);
    const txt = opt ? opt.textContent.replace(/^User:\s*/, '') : uf;
    chipsEl.appendChild(createChip(`User: ${txt}`, () => { $('#uf').value = ''; go(1); }));
  }

  if(dotEl) dotEl.hidden = activeCount === 0;
}
function createChip(label, onRemove){
  const span = document.createElement('span');
  span.className = 'filter-chip';
  span.innerHTML = `<span>${esc(label)}</span><button type="button" title="Hapus filter">×</button>`;
  span.querySelector('button').onclick = (e) => {
    e.stopPropagation();
    onRemove();
  };
  return span;
}
const bReset = $('#btnResetFilters');
if(bReset){
  bReset.onclick = () => {
    $('#apf').value = '';
    $('#cf').value = '';
    $('#uf').value = '';
    go(1);
  };
}
$('#pv').onclick=()=>go(page-1);$('#nx').onclick=()=>go(page+1);
$('#pg').onchange=e=>{ const val = Math.max(1, Math.min(pages, parseInt(e.target.value, 10) || 1)); e.target.value = val; go(val); };
$('#sz').onchange=()=>go(1);$('#apf').onchange=()=>go(1);$('#cf').onchange=()=>go(1);$('#srt').onchange=()=>go(1);
const ufEl=$('#uf');if(ufEl)ufEl.onchange=()=>go(1);
$('#expList').onclick=()=>{
  if(!document.querySelector('#body .pn')){
    toast.info('Tidak ada data untuk diekspor');
    return;
  }
  const q=$('#q').value.trim(),ap=$('#apf').value,cf=$('#cf')?.value||'',uf=$('#uf')?.value||'',srt=$('#srt')?.value||'name_asc';
  const url=`/api/export/csv?q=${encodeURIComponent(q)}&approved=${encodeURIComponent(ap)}&completeness=${encodeURIComponent(cf)}&user_filter=${encodeURIComponent(uf)}&sort=${encodeURIComponent(srt)}`;
  toast.info('Menyiapkan file ekspor CSV...');
  const a=document.createElement('a');
  a.href=url;
  document.body.appendChild(a);
  a.click();
  a.remove();
};
$('#cpyAll').onclick=()=>{
  const list=[];
  document.querySelectorAll('#body .pn').forEach(pn=>{if(pn.dataset.pn)list.push(pn.dataset.pn);});
  const unique=[...new Set(list)];
  if(!unique.length){toast.info('Tidak ada PN untuk disalin');return;}
  copyText(unique.join('\n'), null, `${unique.length} PN disalin`);
};
$('#qc').onclick=clearFilter;
$('#q').addEventListener('input',()=>{
  $('#qc').hidden=!$('#q').value;
  clearTimeout(t);
  t=setTimeout(()=>go(1),300);
});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Escape')clearFilter();
});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.querySelector('dialog[open]'))return;
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();$('#q').focus();$('#q').select();}
  if(e.key==='ArrowLeft'&&page>1)go(page-1);
  if(e.key==='ArrowRight'&&page<pages)go(page+1);
});
document.addEventListener('data-changed',()=>go(page));
const topBtn=document.getElementById('topBtn');
const twEl=document.querySelector('.tw');
if(twEl&&topBtn){
  twEl.addEventListener('scroll',()=>{
    if(twEl.scrollTop>300)topBtn.classList.add('visible');
    else topBtn.classList.remove('visible');
  },{passive:true});
  topBtn.onclick=()=>twEl.scrollTo({top:0,behavior:'smooth'});
}
boot().then(()=>{
  $('#q').value=P.get('q')||'';
  $('#qc').hidden=!$('#q').value;
  try{if(!P.get('size')&&localStorage.getItem('cmp_list_sz'))$('#sz').value=localStorage.getItem('cmp_list_sz');}catch(e){}
  if(P.get('size'))$('#sz').value=P.get('size');
  try{if(!P.get('approved')&&localStorage.getItem('cmp_list_ap')!==null)$('#apf').value=localStorage.getItem('cmp_list_ap');}catch(e){}
  if(P.get('approved'))$('#apf').value=P.get('approved');
  try{if(!P.get('completeness')&&localStorage.getItem('cmp_list_cf'))$('#cf').value=localStorage.getItem('cmp_list_cf');}catch(e){}
  if(P.get('completeness'))$('#cf').value=P.get('completeness');

  const cfEl = $('#cf');
  if(cfEl && Array.isArray(COMPS) && COMPS.length > 0){
    const grp = document.createElement('optgroup');
    grp.label = 'Hanya di satu company spesifik:';
    COMPS.forEach(c => {
      const opt = document.createElement('option');
      opt.value = `only:${c}`;
      opt.textContent = `Hanya ada di ${c}`;
      grp.appendChild(opt);
    });
    cfEl.appendChild(grp);
    if(P.get('completeness')) cfEl.value = P.get('completeness');
    else if(localStorage.getItem('cmp_list_cf')) cfEl.value = localStorage.getItem('cmp_list_cf');
  }

  try{if(!P.get('user_filter')&&localStorage.getItem('cmp_list_uf'))$('#uf').value=localStorage.getItem('cmp_list_uf');}catch(e){}
  if(P.get('user_filter'))$('#uf').value=P.get('user_filter');
  try{if(!P.get('sort')&&localStorage.getItem('cmp_list_srt'))$('#srt').value=localStorage.getItem('cmp_list_srt');}catch(e){}
  if(P.get('sort'))$('#srt').value=P.get('sort');
  CURRENT_SORT=$('#srt')?.value||'name_asc';

  jget('/api/users').then(users => {
    const sel = $('#uf');
    if(!sel || !Array.isArray(users)) return;
    users.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = `User: ${u.username}`;
      sel.appendChild(opt);
    });
    if(P.get('user_filter')) sel.value = P.get('user_filter');
  }).catch(()=>{});

  go(+P.get('page')||1);
});
</script>
</body></html>
