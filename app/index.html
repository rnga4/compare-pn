<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Compare PN</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/template.css"></head>
<body data-page="search"><header id="nav"></header>
<main>
  <section class="hero">
    <h1>Cari PN</h1>
    <p class="mu">Ketik PN dari company mana pun, hasilnya menampilkan PN barang itu di semua company.</p>
    <div class="sb">
      <input id="q" autofocus autocomplete="off" placeholder="Ketik PN atau nama barang…">
      <kbd id="kb">/</kbd><button class="qc" id="qc" hidden aria-label="Hapus">×</button>
    </div>
  </section>
    <div class="bar" id="rbar" hidden><span class="mu" id="info"></span><span class="sp"></span><button class="btn sm" id="cpyAll">Salin Semua PN</button><button class="btn sm" id="expCsv">Export CSV</button><button class="btn sm" id="dn">Rapat</button></div>
  <div class="tw" id="tw" hidden><table class="data"><thead id="head"></thead><tbody id="body"></tbody></table></div>
  <div id="empty"></div>
</main>
<script src="/static/app.js"></script><script src="/static/toast.js"></script>
<script>
let t,seq=0;
const EMPTY_DB=`<div class="cta"><h3>Belum ada data</h3><div class="mu">Mulai dengan salah satu cara ini:</div>
  <div class="cards">
    <button class="card" onclick="$('#bImp').click()"><b>Import file</b><span>Excel / CSV, ratusan ribu baris sekaligus</span></button>
    <button class="card" onclick="$('#bAdd').click()"><b>Tambah manual</b><span>Isi PN per company satu per satu</span></button>
  </div></div>`;
function clearQ(){$('#q').value='';go();$('#q').focus()}
async function go(){
  const raw=$('#q').value,q=raw.trim(),my=++seq;
  document.body.classList.toggle('has-q',!!q);
  $('#qc').hidden=!raw;$('#kb').hidden=!!raw;
  history.replaceState(null,'',q?'?q='+encodeURIComponent(q):location.pathname);
  if(!q){
    $('#tw').hidden=$('#rbar').hidden=true;
    $('#empty').innerHTML=STATS.items
      ?`<div class="empty">${fmt(STATS.items)} barang · ${fmt(STATS.pns)} PN · ${STATS.companies} company tersimpan.<br>Lihat semuanya di <a href="/list">Daftar</a>.</div>`
      :EMPTY_DB;
    return;
  }
  const r=await jget('/api/search?q='+encodeURIComponent(q));
  if(my!==seq)return;
  $('#head').innerHTML=headHtml();
  $('#body').innerHTML=r.map(i=>'<tr>'+rowCells(i,q)+'</tr>').join('');
  $('#tw').hidden=$('#rbar').hidden=!r.length;
  $('#info').textContent=`${fmt(r.length)} barang ditemukan${r.length>=50?' (maks 50, persempit pencarian)':''} · klik PN untuk menyalin`;
  $('#empty').innerHTML=r.length?'':`<div class="empty">Tidak ada hasil untuk <code>${esc(q)}</code>. Cek ejaan, atau tambahkan lewat <b>+ Tambah</b>.</div>`;
}
$('#q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(go,250)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape')clearQ()});
$('#qc').onclick=clearQ;
$('#expCsv').onclick=()=>{
  const rows=[['Barang','Company','PN','Urutan']];
  document.querySelectorAll('#body tr').forEach(tr=>{
    const nm=tr.querySelector('.nm')?.textContent.replace(/^\d+\s*/,'').trim()||'';
    tr.querySelectorAll('.pn').forEach(pn=>{
      const td=pn.closest('td');
      const th=td?Array.from(document.querySelectorAll('#head th')).find((th,i)=>document.querySelectorAll('#body tr')[0].children[i]===td):null;
      const comp=th?th.textContent.trim():'';
      rows.push([nm,comp,pn.dataset.pn,pn.classList.contains('main')?'0':'1']);
    });
  });
  const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download='hasil-pencarian.csv';a.click();
};
$('#cpyAll').onclick=()=>{
  const list=[];
  document.querySelectorAll('#body .pn').forEach(pn=>{if(pn.dataset.pn)list.push(pn.dataset.pn);});
  const txt=[...new Set(list)].join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast.success('Disalin',{description:list.length+' PN tersalin'})).catch(()=>{});
};
document.addEventListener('data-changed',go);
boot().then(()=>{
  const q=new URLSearchParams(location.search).get('q');
  if(q)$('#q').value=q;
  go();
});
</script></body></html>

<script>
// search history
const histKey='cmp-search-hist';
function addHist(q){
  if(!q)return;
  try{
    const h=JSON.parse(localStorage.getItem(histKey)||'[]').filter(x=>x!==q);
    h.unshift(q);localStorage.setItem(histKey,JSON.stringify(h.slice(0,10)));
  }catch(e){}
}
const origGo=go;
go=async function(){
  const q=$('#q').value.trim();
  if(q)addHist(q);
  return origGo.apply(this,arguments);
};
// simple dropdown
$('#q').addEventListener('focus',()=>{
  if(!$('#q').value.trim()) { const d=document.getElementById('qhist'); if(d) d.remove(); return; }
  try{
    const h=JSON.parse(localStorage.getItem(histKey)||'[]');
    if(!h.length)return;
    let d=document.getElementById('qhist');
    if(!d){d=document.createElement('div');d.id='qhist';d.style.cssText='position:absolute;left:0;right:0;top:100%;margin-top:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.16);z-index:60;overflow:hidden;backdrop-filter:blur(8px)';$('#q').parentElement.style.position='relative';$('#q').parentElement.appendChild(d);}
    d.innerHTML=h.map(x=>`<div style="padding:7px 12px;cursor:pointer;font-size:14px" data-q="${esc(x)}">${esc(x)}</div>`).join('');
    d.querySelectorAll('div').forEach(el=>el.onclick=()=>{$('#q').value=el.dataset.q;d.remove();origGo();});
  }catch(e){}
});
document.addEventListener('click',e=>{if(!e.target.closest('.sb')){const d=document.getElementById('qhist');if(d)d.remove();}});
</script>
