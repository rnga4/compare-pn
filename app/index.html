<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Compare PN</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b82f6'/%3E%3Ctext x='50%25' y='54%25' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EPN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="search"><header id="nav"></header>
<main>
  <div class="print-banner">
    <h2>Laporan Pencarian Part Number &bull; Compare PN</h2>
    <p>Dicetak pada: <script>document.write(new Date().toLocaleString('id-ID'))</script></p>
  </div>
  <section class="hero">
    <h1>Cari PN</h1>
    <p class="mu">Ketik PN dari company mana pun, hasilnya menampilkan PN barang itu di semua company.</p>
    <div class="sb">
      <input id="q" autofocus autocomplete="off" placeholder="Ketik PN atau nama barang…">
      <kbd id="kb">/</kbd><button class="qc" id="qc" hidden aria-label="Hapus">×</button>
    </div>
  </section>
    <div class="bar" id="rbar" hidden>
      <span class="mu" id="info"></span>
      <span class="sp"></span>
      <select id="srt" title="Urutan Data" style="max-width:140px">
        <option value="name_asc" selected>Sort: A - Z</option>
        <option value="name_desc">Sort: Z - A</option>
        <option value="id_desc">Sort: Terbaru</option>
        <option value="id_asc">Sort: Terlama</option>
      </select>
      <div class="menu-wrap" id="actMenuWrap">
        <button class="btn sm menu-trigger" id="bActMenu" type="button" aria-expanded="false" aria-haspopup="true">
          <span>Aksi</span>
          <span class="menu-arrow">▾</span>
        </button>
        <div class="menu-dropdown" id="actDropdown" hidden>
          <button class="menu-item" id="cpyAll" type="button">
            <span class="menu-item-label">Salin Semua PN</span>
            <span class="menu-item-desc">Salin daftar nomor part</span>
          </button>
          <button class="menu-item" id="expCsv" type="button">
            <span class="menu-item-label">Export CSV</span>
            <span class="menu-item-desc">Unduh berkas pencarian</span>
          </button>
          <button class="menu-item" id="bPrint" onclick="window.print()" type="button">
            <span class="menu-item-label">Cetak</span>
            <span class="menu-item-desc">Cetak laporan pencarian</span>
          </button>
          <div class="menu-sep"></div>
          <button class="menu-item" id="dn" type="button">
            <span class="menu-item-label">Rapat</span>
            <span class="menu-item-desc">Ubah kerapatan baris tabel</span>
          </button>
        </div>
      </div>
    </div>
  <div class="tw" id="tw" hidden><table class="data"><thead id="head"></thead><tbody id="body"></tbody></table></div>
  <div id="empty"></div>
</main>
<script src="/static/neko.js"></script>
<script src="/static/app.js"></script><script src="/static/toast.js"></script>
<script>
let t,seq=0;
const EMPTY_DB=`<div class="cta"><h3>Belum ada data</h3><div class="mu">Mulai dengan salah satu cara ini:</div>
  <div class="cards">
    <button class="card" onclick="$('#bImp').click()"><b>Import file</b><span>Excel / CSV, ratusan ribu baris sekaligus</span></button>
    <button class="card" onclick="$('#bAdd').click()"><b>Tambah manual</b><span>Isi PN per company satu per satu</span></button>
  </div></div>`;
function clearQ(){$('#q').value='';go();$('#q').focus()}
async function go(){
  const raw=$('#q').value,q=raw.trim(),my=++seq;
  const srt=$('#srt')?.value||'name_asc';
  CURRENT_SORT = srt;
  document.body.classList.toggle('has-q',!!q);
  $('#qc').hidden=!raw;$('#kb').hidden=!!raw;
  history.replaceState(null,'',q?'?q='+encodeURIComponent(q):location.pathname);
  if(!q){
    $('#tw').hidden=$('#rbar').hidden=true;
    $('#empty').innerHTML=STATS.items
      ?`<div class="empty">${fmt(STATS.items)} barang · ${fmt(STATS.pns)} PN · ${STATS.companies} company tersimpan.<br>Lihat semuanya di <a href="/list">Daftar</a>.</div>`
      :EMPTY_DB;
    return;
  }
  $('#head').innerHTML=headHtml();
  $('#body').innerHTML=skeletonHtml((COMPS.length||4)+1, 5);
  $('#tw').hidden=$('#rbar').hidden=false;
  $('#empty').innerHTML='';
  const r=await jget(`/api/search?q=${encodeURIComponent(q)}&sort=${encodeURIComponent(srt)}`);
  if(my!==seq)return;
  $('#head').innerHTML=headHtml();
  $('#body').innerHTML=r.map(i=>'<tr>'+rowCells(i,q)+'</tr>').join('');
  $('#tw').hidden=$('#rbar').hidden=!r.length;
  $('#info').textContent=`${fmt(r.length)} barang ditemukan${r.length>=50?' (maks 50, persempit pencarian)':''} · klik PN untuk menyalin`;
  $('#empty').innerHTML=r.length?'':`<div class="empty">Tidak ada hasil untuk <code>${esc(q)}</code>. Cek ejaan, atau tambahkan lewat <b>+ Tambah</b>.</div>`;
}
$('#q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(go,250)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape')clearQ()});
$('#qc').onclick=clearQ;
$('#srt').onchange=()=>go();
$('#expCsv').onclick=()=>{
  if(!document.querySelector('#body .pn')){
    toast.info('Tidak ada data pencarian untuk diekspor');
    return;
  }
  const rows=[['Barang','Company','PN','Urutan','Diupdate Oleh']];
  const ths=Array.from(document.querySelectorAll('#head th'));
  document.querySelectorAll('#body tr').forEach(tr=>{
    const nm=tr.querySelector('.nm')?.textContent.replace(/^\d+\s*/,'').trim()||'';
    const author=tr.querySelector('.author-col')?.textContent.trim()||'';
    tr.querySelectorAll('.pn').forEach(pn=>{
      const td=pn.closest('td');
      const colIndex=td?Array.from(tr.children).indexOf(td):-1;
      const comp=colIndex>=0&&ths[colIndex]?ths[colIndex].textContent.trim():'';
      rows.push([nm,comp,pn.dataset.pn,pn.classList.contains('main')?'0':'1',author]);
    });
  });
  const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download='hasil-pencarian.csv';a.click();
};
$('#cpyAll').onclick=()=>{
  const list=[];
  document.querySelectorAll('#body .pn').forEach(pn=>{if(pn.dataset.pn)list.push(pn.dataset.pn);});
  const unique=[...new Set(list)];
  if(!unique.length){toast.info('Tidak ada PN untuk disalin');return;}
  copyText(unique.join('\n'), null, `${unique.length} PN disalin`);
};
document.addEventListener('data-changed',go);
boot().then(()=>{
  const q=new URLSearchParams(location.search).get('q');
  if(q)$('#q').value=q;
  go();
});
</script></body></html>
